<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Health Tracker</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div id="app">
        <header id="app-header"><h1>Health Tracker</h1></header>
        <main id="app-main">
            <div class="card" style="text-align:center;margin-top:40px;">
                <p style="font-size:48px;margin-bottom:16px;">📡</p>
                <h2>You're offline</h2>
                <p class="text-muted" style="margin-top:8px;">Check your connection and try again.</p>
                <button class="btn btn-primary" style="margin-top:20px;" onclick="location.reload()">Retry</button>
            </div>
        </main>
    </div>
</body>
</html>
