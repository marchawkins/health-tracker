<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2C1A0E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vitale">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Satisfy loads with display=block so Vitale stays invisible until ready (no FOUT) -->
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=block" rel="stylesheet">
    <!-- UI fonts use swap — brief fallback is fine for body/label text -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Karla:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <title>Vitale</title>
</head>
<body>
    <div id="app">
        <header id="app-header">
            <a href="#dashboard" class="header-icon-btn" data-view="dashboard" aria-label="Dashboard">
                <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 3L2 14h4v15h8v-9h4v9h8V14h4L16 3z" fill="currentColor"/>
                </svg>
            </a>
            <h1 id="page-title">Vitale</h1>
            <a href="#profile" class="header-icon-btn" data-view="profile" aria-label="Profile">
                <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="10" r="6" fill="currentColor"/>
                    <path d="M4 30c0-6.6 5.4-12 12-12s12 5.4 12 12H4z" fill="currentColor"/>
                </svg>
            </a>
        </header>

        <main id="app-main"></main>

        <nav id="app-nav">
            <a href="#food" class="nav-item" data-view="food">
                <span class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 2v8c0 2.2 1.5 4 3.5 4.5V30h3V14.5c2-.5 3.5-2.3 3.5-4.5V2h-2.5v7h-1V2h-2.5v7h-1V2H10z" fill="currentColor"/>
                        <path d="M22 2v28h3V18h2V2h-2v10h-1V2h-2z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="nav-label">Food</span>
            </a>
            <a href="#weight" class="nav-item" data-view="weight" hidden>
                <span class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="26" width="24" height="3" rx="1.5" fill="currentColor"/>
                        <path d="M7 26l3-14h12l3 14H7z" fill="currentColor" opacity="0.4"/>
                        <path d="M7 26l3-14h12l3 14H7z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <circle cx="16" cy="10" r="4" fill="currentColor"/>
                    </svg>
                </span>
                <span class="nav-label">Weight</span>
            </a>
            <a href="#steps" class="nav-item" data-view="steps">
                <span class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="12" cy="26" rx="4.5" ry="3" fill="currentColor"/>
                        <ellipse cx="20" cy="20" rx="4.5" ry="3" transform="rotate(-20 20 20)" fill="currentColor" opacity="0.55"/>
                    </svg>
                </span>
                <span class="nav-label">Steps</span>
            </a>
            <a href="#sleep" class="nav-item" data-view="sleep">
                <span class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 6A12 12 0 1 1 8 26 9 9 0 0 0 20 6z" fill="currentColor"/>
                    </svg>
                </span>
                <span class="nav-label">Sleep</span>
            </a>
        </nav>
    </div>

    <div id="toast-container"></div>

    <!-- Load order matters: API and components before views, views before app -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/chart.js"></script>
    <script src="/js/components/scanner.js"></script>
    <script src="/js/views/login.js"></script>
    <script src="/js/views/register.js"></script>
    <script src="/js/views/forgot-password.js"></script>
    <script src="/js/views/reset-password.js"></script>
    <script src="/js/views/verify-email.js"></script>
    <script src="/js/views/dashboard.js"></script>
    <script src="/js/views/food-log.js"></script>
    <script src="/js/views/weight-log.js"></script>
    <script src="/js/views/metric-log.js"></script>
    <script src="/js/views/profile.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
