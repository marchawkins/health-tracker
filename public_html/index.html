<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAF8F3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Vitale">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <title>Vitale</title>
</head>
<body>
    <div id="app">
        <header id="app-header">
            <a href="#dashboard" class="header-icon-btn header-home-btn" data-view="dashboard" aria-label="Dashboard">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 10.5 12 3l9 7.5M5 9v11h5v-6h4v6h5V9"/>
                </svg>
            </a>
            <h1 id="page-title">Vital<b>e</b></h1>
            <a href="#profile" class="header-icon-btn header-avatar-btn" data-view="profile" aria-label="Profile">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="3.4"/>
                    <path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>
                </svg>
            </a>
        </header>

        <main id="app-main"></main>

        <nav id="app-nav">
            <a href="#food" class="nav-item" data-view="food">
                <span class="nav-icon">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 3v8m0 0a2.4 2.4 0 0 0 0-4.8M4 3v3.2a2 2 0 0 0 2 2M8 3v3.2a2 2 0 0 1-2 2M6 11v10"/>
                        <path d="M16 3c-1.5 1-2.5 3-2.5 6 0 1.6 1 2.4 2.5 2.4V21"/>
                    </svg>
                </span>
                <span class="nav-label">Food</span>
            </a>
            <a href="#weight" class="nav-item" data-view="weight" hidden>
                <span class="nav-icon">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 8h14l1.6 12.5a1 1 0 0 1-1 1.1H4.4a1 1 0 0 1-1-1.1L5 8Z"/>
                        <path d="M9.5 8a2.5 2.5 0 0 1 5 0"/>
                    </svg>
                </span>
                <span class="nav-label">Weight</span>
            </a>
            <a href="#steps" class="nav-item" data-view="steps">
                <span class="nav-icon">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8.5 14c-1.6 0-2.6-1.2-2.8-3-.2-1.6.3-3.6.3-5.2C6 4.3 6.8 3.5 8 3.5s2 .9 2 2.1c0 1.7-.3 2.9-.3 4.6 0 2.2-.6 3.8-1.2 3.8Z"/>
                        <path d="M7 17.5c0 1.4.8 3 2.4 3 1.3 0 2.1-1 2.1-2.3 0-.8-.4-1.6-1.2-2.4"/>
                    </svg>
                </span>
                <span class="nav-label">Steps</span>
            </a>
            <a href="#sleep" class="nav-item" data-view="sleep">
                <span class="nav-icon">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 14.2A8 8 0 0 1 9.8 4 8 8 0 1 0 20 14.2Z"/>
                    </svg>
                </span>
                <span class="nav-label">Sleep</span>
            </a>
        </nav>
    </div>

    <div id="toast-container"></div>

    <!-- Load order matters: API and components before views, views before app -->
    <script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/chart.js"></script>
    <script src="/js/components/scanner.js"></script>
    <script src="/js/views/login.js"></script>
    <script src="/js/views/register.js"></script>
    <script src="/js/views/forgot-password.js"></script>
    <script src="/js/views/reset-password.js"></script>
    <script src="/js/views/verify-email.js"></script>
    <script src="/js/views/dashboard.js"></script>
    <script src="/js/views/food-log.js"></script>
    <script src="/js/views/weight-log.js"></script>
    <script src="/js/views/metric-log.js"></script>
    <script src="/js/views/profile.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
