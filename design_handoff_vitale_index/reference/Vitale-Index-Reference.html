<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Health — Index · Design Reference</title>
<!-- iOS home-screen icon (PWA) -->
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { margin: 0; background: #E9E5DD; }
  .wrap { padding: 56px 40px 80px; font-family: var(--sans); }
  .head { max-width: 1200px; margin: 0 auto 40px; }
  .head h1 { font-family: var(--serif); font-weight: 500; font-size: 38px; color: #1A1610; margin: 0 0 6px; }
  .head p { color: #6B6358; font-size: 15px; margin: 0; max-width: 620px; line-height: 1.5; }
  .row { display: flex; gap: 34px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .cell .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #8a8275; }
  .device { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 70px rgba(40,30,16,.18), 0 0 0 1px rgba(0,0,0,.04); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Health — “Index” direction</h1>
    <p>Editorial monochrome reference. Paper-white surfaces, near-black ink, hairline rings &amp; charts, serif display numbers, one restrained amber accent. These are the four approved screens at 390×844 (logical).</p>
  </div>
  <div class="row" id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frame.jsx"></script>
<script type="text/babel" src="directionA.jsx"></script>
<script type="text/babel">
const cells=[
  ['Dashboard', <IdxDashboard/>],
  ['Log Food',  <IdxFood/>],
  ['Steps',     <IdxSteps/>],
  ['Profile',   <IdxProfile/>],
];
function App(){
  return cells.map(([lab,el],i)=>(
    <div className="cell" key={i}>
      <div className="lab">{lab}</div>
      <div className="device">{el}</div>
    </div>
  ));
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
